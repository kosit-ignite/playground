                                    <div className="flex items-center space-x-2">
                                        <span className="w-6 h-6 rounded-lg bg-sky-500/20 text-sky-400 font-extrabold flex items-center justify-center text-xs border border-sky-500/40 shrink-0">3</span>
                                        <span className="text-[11px] font-medium leading-tight">{t.scaleLabels[3]}</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-extrabold flex items-center justify-center text-xs border border-amber-500/40 shrink-0">2</span>
                                        <span className="text-[11px] font-medium leading-tight">{t.scaleLabels[2]}</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className="w-6 h-6 rounded-lg bg-rose-500/20 text-rose-400 font-extrabold flex items-center justify-center text-xs border border-rose-500/40 shrink-0">1</span>
                                        <span className="text-[11px] font-medium leading-tight">{t.scaleLabels[1]}</span>
                                    </div>
                                </div>

                                <div className="space-y-3.5 max-h-[58vh] overflow-y-auto pr-1">
                                    {questions.map((q, idx) => {
                                        const selectedVal = answers[q.id];
                                        return (
                                            <div 
                                                key={q.id} 
                                                className={`p-4 rounded-2xl border transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-3 ${selectedVal ? 'bg-slate-900/90 border-slate-700/90' : 'bg-slate-900/50 border-slate-800'}`}
                                            >
                                                <div className="flex items-start gap-3">
                                                    <span className={`w-7 h-7 rounded-xl flex items-center justify-center text-xs font-black shrink-0 ${selectedVal ? 'bg-sky-500/20 text-sky-400 border border-sky-500/40' : 'bg-slate-800 text-slate-500'}`}>
                                                        {idx + 1}
                                                    </span>
                                                    <p className="text-sm sm:text-base font-bold text-slate-100 leading-relaxed">
                                                        {lang === 'th' ? q.th : q.en}
                                                    </p>
                                                </div>

                                                <div className="flex items-center justify-end gap-2 shrink-0 self-end md:self-center pt-2 md:pt-0 border-t md:border-t-0 border-slate-800/80 w-full md:w-auto">
                                                    {[4, 3, 2, 1].map((val) => {
                                                        const isSelected = selectedVal === val;
                                                        let styleClasses = "bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-500 hover:text-white";
                                                        
                                                        if (isSelected) {
                                                            if (val === 4) styleClasses = "bg-emerald-600 border-emerald-400 text-white shadow-md shadow-emerald-600/30 font-black scale-105";
                                                            if (val === 3) styleClasses = "bg-sky-600 border-sky-400 text-white shadow-md shadow-sky-600/30 font-black scale-105";
                                                            if (val === 2) styleClasses = "bg-amber-600 border-amber-400 text-white shadow-md shadow-amber-600/30 font-black scale-105";
                                                            if (val === 1) styleClasses = "bg-rose-600 border-rose-400 text-white shadow-md shadow-rose-600/30 font-black scale-105";
                                                        }

                                                        return (
                                                            <button
                                                                key={val}
                                                                onClick={() => handleSelectScore(q.id, val)}
                                                                className={`w-10 h-9 sm:w-11 sm:h-10 rounded-xl border text-xs sm:text-sm font-extrabold transition-all flex items-center justify-center ${styleClasses}`}
                                                                title={`Score ${val}`}
                                                            >
                                                                {val}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-slate-800">
                                    <button
                                        onClick={() => setStep('disclaimer')}
                                        className="text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-2"
                                    >
                                        <i className="fa-solid fa-arrow-left"></i>
                                        {t.prevBtn}
                                    </button>

                                    <button
                                        onClick={() => setStep('results')}
                                        disabled={Object.keys(answers).length < questions.length}
                                        className="w-full sm:w-auto px-7 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500 hover:opacity-95 disabled:opacity-40 disabled:hover:opacity-40 text-white font-bold text-xs sm:text-sm transition shadow-xl shadow-emerald-500/20 flex items-center justify-center gap-2.5"
                                    >
                                        <i className="fa-solid fa-chart-line text-sm"></i>
                                        <span>{t.submitBtn}</span>
                                        {Object.keys(answers).length < questions.length && (
                                            <span className="text-[10px] bg-black/30 px-2 py-0.5 rounded-full font-medium">
                                                ({questions.length - Object.keys(answers).length} {lang === 'th' ? "ข้อที่เหลือ" : "left"})
                                            </span>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </main>
                    )}

                    {}
                    {step === 'results' && (
                        <main className="flex-grow flex flex-col justify-center space-y-5">
                            <div className="glass-panel rounded-3xl p-5 sm:p-6 border border-slate-700/60 shadow-xl">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-sky-500/10 text-sky-400 border border-sky-500/30 mb-2">
                                            <i className="fa-solid fa-award"></i>
                                            <span>{t.resultsTitle}</span>
                                        </div>
                                        <h2 className="text-xl sm:text-2xl md:text-3xl font-black text-white">
                                            {lang === 'th' ? results.profile.thTitle : results.profile.title}
                                        </h2>
                                        <p className="text-xs sm:text-sm font-semibold text-sky-400 mt-0.5">
                                            {results.profile.subtitle}
                                        </p>
                                    </div>

                                    <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-700/80 flex items-center gap-4 shadow-xl shrink-0 w-full sm:w-auto justify-between sm:justify-start">
                                        <div>
                                            <div className="text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400">
                                                {results.total} <span className="text-sm text-slate-500 font-medium">/ 40</span>
                                            </div>
                                            <div className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">
                                                {t.scoreLabel}
                                            </div>
                                        </div>
                                        <div className="h-10 w-px bg-slate-800"></div>
                                        <div>
                                            <div className="text-xs font-extrabold text-emerald-400 uppercase">
                                                {results.total >= 35 ? "Tier 1: Enterprise Leader" : results.total >= 28 ? "Tier 2: Functional Partner" : "Tier 3: Developing Synergy"}
                                            </div>
                                            <div className="text-[10px] text-slate-400">
                                                {t.benchmarkLabel}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gradient-to-r from-amber-500/15 via-sky-500/15 to-emerald-500/15 border border-amber-500/40 rounded-2xl p-3.5 flex items-center gap-3 shadow-lg">
                                <div className="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center justify-center shrink-0 text-base font-bold">
                                    <i className="fa-solid fa-camera"></i>
                                </div>
                                <div className="text-xs font-semibold text-amber-200 leading-relaxed">
                                    {t.screenshotNotice}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                                <div className="lg:col-span-5 glass-panel rounded-3xl p-5 border border-slate-700/60 shadow-xl flex flex-col justify-between space-y-4">
                                    <div>
                                        <h3 className="text-sm font-extrabold text-white flex items-center gap-2 mb-3">
                                            <i className="fa-solid fa-chart-pie text-sky-400"></i>
                                            <span>{lang === 'th' ? "กราฟวิเคราะห์สมรรถนะ 4 มิติ" : "4-Dimension Competency Radar"}</span>
                                        </h3>
                                        <div className="relative w-full h-64 sm:h-72">
                                            <canvas ref={chartRef}></canvas>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div className="bg-slate-900/80 rounded-xl p-2.5 border border-slate-800">
                                            <div className="text-slate-400 text-[10px] truncate">{t.dimStrategic}</div>
                                            <div className="text-sky-400 font-extrabold text-sm mt-0.5">{results.dimScores.strategic} <span className="text-[10px] text-slate-500">/ 4.0</span></div>
                                        </div>
                                        <div className="bg-slate-900/80 rounded-xl p-2.5 border border-slate-800">
                                            <div className="text-slate-400 text-[10px] truncate">{t.dimRisk}</div>
                                            <div className="text-sky-400 font-extrabold text-sm mt-0.5">{results.dimScores.risk} <span className="text-[10px] text-slate-500">/ 4.0</span></div>
                                        </div>
                                        <div className="bg-slate-900/80 rounded-xl p-2.5 border border-slate-800">
                                            <div className="text-slate-400 text-[10px] truncate">{t.dimSynergy}</div>
                                            <div className="text-sky-400 font-extrabold text-sm mt-0.5">{results.dimScores.synergy} <span className="text-[10px] text-slate-500">/ 4.0</span></div>
                                        </div>
                                        <div className="bg-slate-900/80 rounded-xl p-2.5 border border-slate-800">
                                            <div className="text-slate-400 text-[10px] truncate">{t.dimRelational}</div>
                                            <div className="text-sky-400 font-extrabold text-sm mt-0.5">{results.dimScores.relational} <span className="text-[10px] text-slate-500">/ 4.0</span></div>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-7 space-y-4">
                                    <div className="glass-panel rounded-3xl p-5 border border-sky-500/30 bg-gradient-to-br from-sky-950/40 via-slate-900/80 to-slate-900/90 shadow-xl space-y-2">
                                        <div className="flex items-center gap-2 text-xs font-bold text-sky-400">
                                            <i className="fa-solid fa-lightbulb"></i>
                                            <span>{lang === 'th' ? "สรุปภาพรวมในภาษาเข้าใจง่าย" : "Summary in Simple Language"}</span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-slate-200 font-medium leading-relaxed">
                                            {results.profile.simpleSummary}
                                        </p>
                                        <p className="text-xs text-slate-400 leading-relaxed pt-1 border-t border-slate-800/80">
                                            {results.profile.desc}
                                        </p>
                                    </div>

                                    <div className="glass-panel rounded-3xl p-5 border border-slate-700/60 shadow-xl space-y-3">
                                        <h3 className="text-xs font-extrabold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                                            <i className="fa-solid fa-circle-check"></i>
                                            <span>{lang === 'th' ? "จุดแข็งโดดเด่นประจำตัวคุณ" : "Key Collaborator Strengths"}</span>
                                        </h3>
                                        <ul className="space-y-2 text-xs sm:text-sm text-slate-300">
                                            {results.profile.strengths.map((str, idx) => (
                                                <li key={idx} className="flex items-start gap-2.5">
                                                    <span className="w-5 h-5 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">
                                                        ✓
                                                    </span>
                                                    <span>{str}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="glass-panel rounded-3xl p-5 border border-slate-700/60 shadow-xl space-y-3">
                                        <h3 className="text-xs font-extrabold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                            <i className="fa-solid fa-compass"></i>
                                            <span>{lang === 'th' ? "ข้อเสนอแนะหลักเพื่อยกระดับศักยภาพ (Core Recommendations)" : "Core Recommendations to Elevate Collaboration"}</span>
                                        </h3>
                                        <ul className="space-y-2 text-xs sm:text-sm text-slate-300">
                                            {results.profile.coreRecommendations.map((rec, idx) => (
                                                <li key={idx} className="flex items-start gap-2.5">
                                                    <span className="w-5 h-5 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">
                                                        {idx + 1}
                                                    </span>
                                                    <span>{rec}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="glass-panel rounded-3xl p-5 border border-slate-700/60 shadow-xl space-y-3">
                                        <h3 className="text-xs font-extrabold text-sky-400 uppercase tracking-wider flex items-center gap-2">
                                            <i className="fa-solid fa-graduation-cap"></i>
                                            <span>{lang === 'th' ? "หลักสูตรอบรมแนะนำเฉพาะบุคคล (Tailored Course Modules)" : "Tailored Executive Course Recommendations"}</span>
                                        </h3>
                                        <div className="grid grid-cols-1 gap-2.5">
                                            {results.profile.courses.map((course, idx) => (
                                                <div key={idx} className="bg-slate-900/90 rounded-2xl p-3 border border-slate-800 hover:border-sky-500/40 transition">
                                                    <div className="text-xs sm:text-sm font-bold text-slate-100 flex items-center justify-between gap-2">
                                                        <span>{course.name}</span>
                                                        <span className="text-[10px] px-2 py-0.5 rounded-md bg-sky-500/10 text-sky-300 border border-sky-500/20 shrink-0 font-mono">Module {idx+1}</span>
                                                    </div>
                                                    <div className="text-[11px] text-slate-400 mt-1 flex items-center gap-1.5">
                                                        <i className="fa-solid fa-bullseye text-emerald-400 text-[10px]"></i>
                                                        <span><strong className="text-slate-300">{lang === 'th' ? "เน้นการพัฒนา:" : "Core Focus:"}</strong> {course.focus}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-3 border-t border-slate-800">
                                <button
                                    onClick={() => {
                                        setStep('assessment');
                                        setAnswers({});
                                    }}
                                    className="w-full sm:w-auto px-6 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs sm:text-sm transition border border-slate-700 flex items-center justify-center gap-2 shadow-lg"
                                >
                                    <i className="fa-solid fa-rotate-right"></i>
                                    {t.retakeBtn}
                                </button>
                            </div>
                        </main>
                    )}

                    <footer className="mt-8 pt-4 border-t border-slate-800/80 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
                        <span>{t.sponsorText}</span>
                        <span>© {new Date().getFullYear()} Executive Collaboration Diagnostic Platform</span>
                    </footer>
                </div>
            );
        }

        // Render application securely
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
